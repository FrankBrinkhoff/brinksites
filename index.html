<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinksites | Frank Brinkhoff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Welkom bij Brinksites</h1>
    <p>Websites op maat door Frank Brinkhoff</p>
    <a href="#contact" class="btn">Neem contact op</a>
</header>

<section id="over">
    <h2>Over mij</h2>
    <p>Ik ben Frank Brinkhoff, webdeveloper met een passie voor maatwerk en kwaliteit.</p>
</section>

<section id="diensten">
    <h2>Diensten</h2>
    <ul>
        <li>Website ontwikkeling</li>
        <li>Responsive design</li>
        <li>Onderhoud & optimalisatie</li>
        <li>SEO & performance</li>
    </ul>
</section>

<section id="contact">
    <h2>Contact</h2>
    <form id="contactForm">
        <input type="text" name="name" placeholder="Naam" required>
        <input type="email" name="email" placeholder="E-mail" required>
        <textarea name="message" placeholder="Bericht" required></textarea>
        <button type="submit">Verstuur bericht</button>
        <p id="formMessage"></p>
    </form>
</section>
